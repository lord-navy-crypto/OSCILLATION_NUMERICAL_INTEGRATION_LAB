name: Bug report
description: Report a reproducible numerical, physics, UI, or packaging problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please include enough information to reproduce the problem.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include parameters, method, timestep, platform, and relevant output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS / Windows / Linux, Python version
    validations:
      required: true
