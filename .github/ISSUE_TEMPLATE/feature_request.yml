name: Feature request
description: Suggest a physics, numerical-analysis, visualization, or workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What scientific or usability problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the model, algorithm, input/output, or UI behavior you have in mind.
