name: In-app setup handoff smoke check

on:
  pull_request:
    paths: ["app.py", ".github/workflows/in-app-handoff.yml"]
  push:
    branches: [main]
    paths: ["app.py", ".github/workflows/in-app-handoff.yml"]

jobs:
  syntax-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Streamlit source and session restoration
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("app.py").read_text(encoding="utf-8")
          compile(src, "app.py", "exec")
          assert "Pin current setup" in src
          assert "Restore pinned setup" in src
          assert "for key in RESULT_KEYS:" in src
          print("PASS: Oscillation experiment in-app restore")
          PY
